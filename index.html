<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜市彈珠台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* Layout: one-screen arcade cabinet — wooden board centered, HUD above, launch control below */
:root{
  --night:#1d1530;      /* page ground: night-market sky */
  --wood:#8a4b22;       /* cabinet frame */
  --wood-dark:#5a2c12;
  --face:#f3e3bf;       /* painted board face */
  --lantern:#e8432e;    /* red lantern accent */
  --brass:#d9a441;
  --ink:#fff5e2;
  --muted:#b9a8d6;
  --display:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%}
body{margin:0;box-sizing:border-box;min-height:100%;
  background:radial-gradient(ellipse at 50% -10%,#3b2457 0%,var(--night) 60%);
  background-color:var(--night);
  color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  user-select:none;-webkit-user-select:none;overflow-x:hidden;
}
.side{display:contents}
header{order:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:center}
.hud{order:2}
.board-wrap{order:3}
.controls{order:4}
.hint{order:5}
h1{font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.12em;color:var(--ink);
  text-shadow:0 0 12px rgba(232,67,46,.7);animation:sign-glow 2.6s ease-in-out infinite alternate}
@keyframes sign-glow{
  from{text-shadow:0 0 10px rgba(232,67,46,.55)}
  to{text-shadow:0 0 22px rgba(255,180,60,.9),0 0 42px rgba(232,67,46,.5)}
}
.sub{color:var(--muted);font-size:.85rem}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,400px)}
.stat{background:rgba(0,0,0,.28);border:1px solid rgba(217,164,65,.35);border-radius:8px;padding:6px 10px}
.stat .k{font-size:.7rem;color:var(--muted);letter-spacing:.1em}
.stat .v{font-family:var(--display);font-size:1.24rem;color:var(--brass);font-variant-numeric:tabular-nums}
.board-wrap{position:relative;width:min(100%,400px,calc((100dvh - 256px) * 360 / 620));max-width:100%}
canvas{display:block;width:100%;height:auto;aspect-ratio:360/620;border-radius:22px 22px 10px 10px;
  box-shadow:0 18px 40px rgba(0,0,0,.55);touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(29,21,48,.8);border-radius:22px 22px 10px 10px;text-align:center;padding:20px}
.overlay h2{margin:0;font-weight:900;font-size:1.5rem}
.overlay p{margin:0;color:var(--muted);max-width:28ch;line-height:1.7;font-size:.92rem}
.overlay .big{font-family:var(--display);font-size:2.4rem;color:var(--brass)}
.controls{display:flex;gap:10px;align-items:center;width:min(100%,400px)}
.meter{flex:1;height:14px;border-radius:7px;background:rgba(0,0,0,.35);border:1px solid rgba(217,164,65,.35);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--lantern))}
button{font-family:var(--body);font-weight:900;font-size:1rem;color:var(--ink);background:var(--lantern);
  border:0;border-radius:10px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #8f2316;touch-action:none}
button:active,button.held{transform:translateY(3px);box-shadow:0 1px 0 #8f2316}
button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hint{font-size:.78rem;color:var(--muted);text-align:center}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:92%;text-align:center;
  font-family:var(--display);font-size:2rem;line-height:1.15;padding:0 4px;
  color:var(--brass);text-shadow:0 2px 0 var(--wood-dark);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.big{top:32%;font-size:2.1rem;color:#ffe9a8;text-shadow:0 3px 0 #8f2316,0 0 26px rgba(255,180,60,.85)}
.toast.small{top:58%;font-size:1.05rem;color:#ffe9a8;letter-spacing:.04em;text-shadow:0 2px 0 rgba(60,20,10,.6)}
/* combo badge + fever timer live on the board, so the page layout never shifts */
.combo{position:absolute;top:10px;left:50%;translate:-50% 0;display:flex;align-items:baseline;gap:6px;
  padding:4px 11px;border-radius:999px;background:rgba(232,67,46,.92);border:2px solid var(--brass);
  color:#fff5e2;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;
  transform-origin:center;transition:transform .12s ease-out}
.combo b{font-family:var(--display);font-size:1.25rem;line-height:1}
.combo span{font-size:.68rem;letter-spacing:.08em}
.combo.pop{transform:scale(1.16)}
.fever{position:absolute;left:10px;right:10px;bottom:10px;height:8px;border-radius:999px;
  background:rgba(0,0,0,.45);border:1px solid rgba(217,164,65,.65);overflow:hidden;pointer-events:none}
.fever i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffe9a8,var(--lantern));
  transform-origin:left center}
[hidden]{display:none!important}
@media (max-width:340px){ .hint{font-size:.7rem} }
/* Desktop: cabinet fills the window height, info moves to a side rail */
@media (min-width:1000px){
  body{
    display:grid;
    grid-template-columns:minmax(300px,380px) auto;
    align-content:center;
    align-items:start;
    justify-content:center;
    column-gap:clamp(28px,4vw,64px);
    max-width:1240px;
    margin-inline:auto;
    padding:20px clamp(24px,4vw,64px);
  }
  .side{grid-column:1;align-self:center;display:flex;flex-direction:column;gap:14px;width:100%;box-sizing:border-box;
    padding:22px;border-radius:20px;border:1px solid rgba(217,164,65,.22);
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(0,0,0,.2));
    box-shadow:0 20px 50px rgba(0,0,0,.35)}
  header{flex-direction:column;align-items:flex-start;gap:4px}
  h1{font-size:2.2rem}
  .sub{font-size:.9rem}
  .board-wrap{grid-column:2;width:min(calc((100dvh - 48px) * 360 / 620),600px)}
  .hud{grid-template-columns:1fr;width:100%}
  .stat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 14px}
  .stat .v{font-size:1.6rem}
  .controls{width:100%}
  .controls button{padding:14px 22px;font-size:1.05rem}
  .hint{width:100%;text-align:left;font-size:.82rem}
  .overlay h2{font-size:2rem}
  .overlay p{font-size:1rem;max-width:34ch}
  .overlay .big{font-size:3rem}
  .overlay button{padding:14px 26px;font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){
  h1{animation:none}
  .combo{transition:none}
}
</style>
</head>
<body>

<div class="side">
  <header>
    <h1>夜市彈珠台</h1>
    <span class="sub">連擊加倍 · 金珠 ×3 · 中央杯再送 2 顆</span>
  </header>

  <div class="hud">
    <div class="stat"><div class="k">分數</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">剩餘彈珠</div><div class="v" id="left">10</div></div>
    <div class="stat"><div class="k">最高分</div><div class="v" id="best">0</div></div>
  </div>

  <div class="controls">
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <button id="pull" aria-label="按住蓄力，放開發射">拉桿</button>
  </div>
  <div class="hint">點畫面或空白鍵拉桿 · 連發連擊 ×5 · 好運加倍 ×2</div>
</div>

<div class="board-wrap">
  <canvas id="c" width="360" height="620" aria-label="彈珠台遊戲畫面"></canvas>
  <div class="combo" id="combo" hidden><b id="comboMult">×2</b><span id="comboLabel">連擊 2</span></div>
  <div class="fever" id="fever" hidden aria-hidden="true"><i id="feverFill"></i></div>
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">十顆彈珠，賭一晚手氣</h2>
    <div class="big" id="ovScore" hidden>0</div>
    <p id="ovText">按住拉桿蓄力，放開發射。<br>快速連發會疊加連擊倍率，金珠一顆抵三顆；敲進中央 500 杯，老闆再送你 2 顆。</p>
    <button id="startBtn">開始</button>
  </div>
</div>

<script>
(() => {
  const W = 360, H = 620;
  const $ = id => document.getElementById(id);
  const cv = $('c');
  const ctx = cv.getContext('2d');
  // render at the displayed size so the board stays sharp when it grows on desktop
  function fitCanvas() {
    const cssW = cv.getBoundingClientRect().width;
    if (!cssW) return;
    const k = Math.min(window.devicePixelRatio || 1, 3) * (cssW / W);
    const pxW = Math.round(W * k), pxH = Math.round(H * k);
    if (pxW !== cv.width || pxH !== cv.height) {
      cv.width = pxW; cv.height = pxH;
      ctx.setTransform(k, 0, 0, k, 0, 0);
    }
  }
  fitCanvas();
  if (window.ResizeObserver) new window.ResizeObserver(fitCanvas).observe(cv);
  else window.addEventListener('resize', fitCanvas);

  // --- geometry ---
  const G = 900, R_BALL = 6.5;
  const CX = 180, CY = 190, RAD = 168;       // top arch
  const LEFT = 12, DIV_X = 316, DIV_W = 5;   // field | shooter lane divider
  const LANE_X = 334, LANE_REST = 588;
  const SLOT_TOP = 532, BOTTOM = 604;
  const SLOT_VALUES = [50, 10, 20, 100, 20, 10, 50];
  const slotW = (DIV_X - LEFT) / SLOT_VALUES.length;

  // --- tuning for the fun layer ---
  const COMBO_WINDOW = 5;     // seconds between scores to keep a combo alive
  const COMBO_MAX = 5;        // highest multiplier
  const FEVER_TIME = 8;       // seconds of double points after a jackpot
  const GOLD_CHANCE = 0.12;   // one marble in ~8 turns gold (x3)

  const pockets = [
    { x: 168, y: 262, v: 500, r: 10 },
    { x: 84,  y: 380, v: 200, r: 10 },
    { x: 252, y: 380, v: 200, r: 10 },
  ];

  // round bumpers: kick the marble away harder than it arrived
  const bumpers = [
    { x: 118, y: 300, r: 10 }, { x: 218, y: 300, r: 10 },
    { x: 168, y: 440, r: 10 }, { x: 60, y: 470, r: 9 }, { x: 276, y: 470, r: 9 },
  ];
  const pins = [];
  for (let row = 0, y = 225; y <= 508; row++, y += 22) {
    // even rows start 10px from the wall so no free channel runs down either side
    for (let x = 22 + (row % 2) * 15; x <= 306; x += 30) {
      if (pockets.some(p => Math.hypot(p.x - x, p.y - y) < 22)) continue;
      if (bumpers.some(q => Math.hypot(q.x - x, q.y - y) < q.r + 13)) continue;
      pins.push({ x, y, r: 3 });
    }
  }
  pockets.forEach(p => {             // funnel pins beside each cup
    pins.push({ x: p.x - 13, y: p.y - 4, r: 3 }, { x: p.x + 13, y: p.y - 4, r: 3 });
  });
  const dividers = [];
  for (let i = 1; i < SLOT_VALUES.length; i++) dividers.push(LEFT + i * slotW);
  dividers.forEach(x => pins.push({ x, y: SLOT_TOP, r: 2.5 }));

  // drop any pin that would leave a gap narrower than a marble (it could wedge there)
  for (let i = pins.length - 1; i >= 0; i--) {
    const a = pins[i];
    if (pins.some((b, j) => j < i && Math.hypot(a.x - b.x, a.y - b.y) < 2 * R_BALL + a.r + b.r + 1 && Math.hypot(a.x - b.x, a.y - b.y) > 0.1)) pins.splice(i, 1);
  }

  // --- state ---
  let balls = [], score = 0, left = 10, best = 0, playing = false;
  let charging = false, power = 0;
  let flashes = [], bits = [];
  let combo = 0, comboTimer = 0, fever = 0, shake = 0;
  let slotFlash = null, pocketFlash = null, goldSeen = false;
  let lastCombo = -1, lastFeverW = '';
  try { best = +localStorage.getItem('marble-best') || 0; } catch (e) {}

  const hud = () => { $('score').textContent = score; $('left').textContent = left; $('best').textContent = best; };

  // --- sound (starts after first interaction) ---
  let ac = null, lastTick = 0;
  function beep(freq, dur, vol = 0.04, type = 'triangle') {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  function unlockAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function fanfare() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, .07, 'square'), i * 90));
  }

  function laneBall() { return balls.find(b => b.state === 'lane'); }
  function loadBall() {
    if (left > 0 && !laneBall()) {
      left--;
      // one gold marble is guaranteed per round: if none showed up yet,
      // the last marble of the round turns gold as a "last hurrah"
      let gold = Math.random() < GOLD_CHANCE;
      const forced = !gold && !goldSeen && left === 0;
      if (forced) gold = true;
      goldSeen = goldSeen || gold;
      balls.push({ x: LANE_X, y: LANE_REST, vx: 0, vy: 0, state: 'lane', still: 0,
        hue: Math.random() * 360, gold, trail: [] });
      hud();
      if (gold) toast(forced ? '壓軸金珠！' : '金珠出現！');
    }
  }

  // --- juice: toast, quips, particles ---
  const QUIPS = ['哎呀，差一點！', '這格…也不錯啦', '老闆娘笑了', '再一顆試試', '手氣還沒熱喔', '老闆默默擦桌子'];
  let toastUntil = 0;
  function toast(text, big, small) {
    const t = $('toast');
    t.textContent = text;
    t.classList.toggle('big', !!big);
    t.classList.toggle('small', !!small);
    t.classList.add('show');
    const dur = big ? 1100 : small ? 950 : 700;
    toastUntil = performance.now() + dur;
    clearTimeout(toast.h);
    toast.h = setTimeout(() => t.classList.remove('show', 'big', 'small'), dur);
  }
  function quip() {
    if (performance.now() < toastUntil) return;
    toast(QUIPS[(Math.random() * QUIPS.length) | 0], false, true);
  }
  function burst(x, y, n, hues, pw = 1) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (70 + Math.random() * 280) * pw;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80,
        life: 0, max: .45 + Math.random() * .7, size: 1.4 + Math.random() * 2.6,
        hue: hues[(Math.random() * hues.length) | 0] });
    }
  }

  function jackpot(x, y) {
    fever = FEVER_TIME;
    left += 2; hud();
    burst(x, y, 70, [38, 45, 10, 355, 28], 2);
    shake = 16;
    toast('中大獎！再送 2 顆', true);
    fanfare();
    setTimeout(() => { if (playing) toast('好運加倍 ' + FEVER_TIME + ' 秒'); }, 1250);
  }

  function award(v, x, y, gold) {
    combo++; comboTimer = COMBO_WINDOW;
    const cm = Math.min(COMBO_MAX, 1 + Math.floor(combo / 2));
    const fm = fever > 0 ? 2 : 1;
    const gm = gold ? 3 : 1;
    const gain = v * cm * fm * gm;
    score += gain; hud();

    flashes.push({ x, y, v: gain, t: 0, big: gain >= 600, gold: !!gold });
    burst(x, y, gain >= 300 ? 30 : 10, gold ? [42, 35, 50] : [45, 12, 355], gain >= 300 ? 1.5 : .8);

    if (gain >= 300) {
      const tag = (gold ? '金珠×3 ' : '') + (cm > 1 ? '連擊×' + cm + ' ' : '');
      toast(tag + '+' + gain, gain >= 800);
      beep(520 + Math.min(500, combo * 50), .16, .06, 'square');
    } else {
      if (Math.random() < .3) quip();
      beep(420 + Math.min(400, combo * 40), .12, .05);
    }
  }

  // --- physics ---
  function collideCircle(b, px, py, pr, e) {
    const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), min = R_BALL + pr;
    if (d >= min || d === 0) return false;
    const nx = dx / d, ny = dy / d;
    b.x = px + nx * min; b.y = py + ny * min;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      b.vx += (Math.random() - .5) * 60;  // jitter so paths vary and balls never balance on a pin
      return -vn;
    }
    return false;
  }

  function step(b, dt) {
    b.vy += G * dt;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 1400) { b.vx *= 1400 / sp; b.vy *= 1400 / sp; }
    b.x += b.vx * dt; b.y += b.vy * dt;

    // arch
    if (b.y < CY) {
      const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy), lim = RAD - R_BALL;
      if (d > lim) {
        const nx = dx / d, ny = dy / d;
        b.x = CX + nx * lim; b.y = CY + ny * lim;
        const vn = b.vx * nx + b.vy * ny;
        if (vn > 0) { b.vx -= 1.15 * vn * nx; b.vy -= 1.15 * vn * ny; }
        // left half of the arch has a springy rim: push the marble off it into the pins
        if (b.state === 'field' && b.x < CX - 40) { b.vx -= nx * 140; b.vy -= ny * 140; }
      }
    }

    if (b.state === 'lane') {
      if (b.y >= CY) { b.x = LANE_X; b.vx = 0; }
      const rest = LANE_REST + (charging ? power * 26 : 0);
      if (b.y >= rest && b.vy >= 0) { b.y = rest; b.vy = 0; }
      if (b.x < DIV_X - 4) b.state = 'field';
      return;
    }

    // field walls
    if (b.x < LEFT + R_BALL) { b.x = LEFT + R_BALL; b.vx = Math.abs(b.vx) * 0.7 + 20; }
    if (b.y > CY - 60 && b.x > DIV_X - R_BALL) { b.x = DIV_X - R_BALL; b.vx = -Math.abs(b.vx) * 0.7 - 20; }

    for (const p of pins) {
      const hit = collideCircle(b, p.x, p.y, p.r, 0.68);
      if (hit && hit > 120) {
        const now = performance.now();
        if (now - lastTick > 35) { lastTick = now; beep(1800 + Math.random() * 600, .03, Math.min(.03, hit / 20000)); }
      }
    }

    for (const q of bumpers) {
      const dx = b.x - q.x, dy = b.y - q.y, d = Math.hypot(dx, dy), min = R_BALL + q.r;
      if (d < min && d > 0) {
        const nx = dx / d, ny = dy / d;
        b.x = q.x + nx * min; b.y = q.y + ny * min;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny;
          b.vx += nx * 160; b.vy += ny * 160;   // extra kick
          q.flash = 0.15; beep(520 + Math.random() * 80, .08, .05, 'square');
          burst(q.x, q.y, 5, [12, 28], .6);
        }
      }
    }

    if (b.y > SLOT_TOP) {
      for (const x of dividers) {
        if (Math.abs(b.x - x) < R_BALL + 1.5) {
          const s = b.x < x ? -1 : 1;
          b.x = x + s * (R_BALL + 1.5); b.vx = s * Math.abs(b.vx) * 0.4;
        }
      }
    }

    for (const p of pockets) {
      if (Math.hypot(b.x - p.x, b.y - p.y) < p.r - 5 && b.vy > 0) {
        b.done = true;
        award(p.v, p.x, p.y, b.gold);
        pocketFlash = { p, t: 0 };
        if (p.v >= 500) jackpot(p.x, p.y);
        return;
      }
    }

    if (b.y > BOTTOM - R_BALL) {
      const i = Math.max(0, Math.min(SLOT_VALUES.length - 1, Math.floor((b.x - LEFT) / slotW)));
      b.done = true;
      slotFlash = { i, t: 0 };
      award(SLOT_VALUES[i], LEFT + (i + .5) * slotW, BOTTOM - 20, b.gold);
      return;
    }

    // stuck guard
    if (Math.hypot(b.vx, b.vy) < 8) { b.still += dt; if (b.still > 1.2) { b.vy -= 220; b.vx += (Math.random() < .5 ? -1 : 1) * (120 + Math.random() * 160); b.still = 0; } }
    else b.still = 0;
  }

  // --- drawing ---
  function roundTopPath() {
    ctx.beginPath();
    ctx.moveTo(LEFT - 6, H);
    ctx.lineTo(LEFT - 6, CY);
    ctx.arc(CX, CY, RAD + 6, Math.PI, 0);
    ctx.lineTo(CX + RAD + 6, H);
    ctx.closePath();
  }

  function lantern(x, y, swing, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(swing);
    ctx.strokeStyle = '#3a1a0a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -4); ctx.stroke();
    ctx.shadowColor = 'rgba(255,120,60,.9)'; ctx.shadowBlur = 16;
    const g = ctx.createRadialGradient(-3, 4, 2, 0, 10, 15 * scale);
    g.addColorStop(0, '#ff9a72'); g.addColorStop(.65, '#e8432e'); g.addColorStop(1, '#a82418');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 10, 10 * scale, 13 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d9a441';
    ctx.fillRect(-4 * scale, -4, 8 * scale, 3);
    ctx.fillRect(-4 * scale, 21 * scale, 8 * scale, 3);
    ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, 23 * scale); ctx.lineTo(0, 31 * scale); ctx.stroke();
    ctx.restore();
  }

  function drawBoard(time) {
    const wood = ctx.createLinearGradient(0, 0, W, 0);
    wood.addColorStop(0, '#5a2c12'); wood.addColorStop(.5, '#8a4b22'); wood.addColorStop(1, '#5a2c12');
    ctx.fillStyle = wood; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
    for (let y = 8; y < H; y += 11) { ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(120, y + 4, 240, y - 4, W, y + 2); ctx.stroke(); }

    roundTopPath();
    const face = ctx.createRadialGradient(CX, 260, 40, CX, 320, 380);
    face.addColorStop(0, '#fbefd2'); face.addColorStop(1, '#e8d2a2');
    ctx.fillStyle = face; ctx.fill();

    // painted sunburst behind the jackpot cup
    ctx.save(); roundTopPath(); ctx.clip();
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = i % 2 ? 'rgba(232,67,46,.07)' : 'rgba(217,164,65,.08)';
      ctx.beginPath(); ctx.moveTo(168, 262);
      ctx.arc(168, 262, 420, i * Math.PI / 12, (i + 1) * Math.PI / 12); ctx.fill();
    }
    // jackpot cup breathes a little to advertise itself
    const pulse = (Math.sin(time * 3) + 1) / 2;
    ctx.globalAlpha = .12 + .18 * pulse;
    const halo = ctx.createRadialGradient(168, 262, 4, 168, 262, 120);
    halo.addColorStop(0, '#ffd76a'); halo.addColorStop(1, 'rgba(255,215,106,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(168, 262, 120, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = 'rgba(255,140,60,.8)'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#c0392b'; ctx.font = '900 22px "Noto Sans TC", sans-serif';
    ctx.fillText('好 運 彈 珠', CX, 120);
    ctx.restore();
    ctx.fillStyle = '#8a4b22'; ctx.font = '500 11px "Noto Sans TC", sans-serif';
    ctx.fillText('一 顆 一 顆 慢 慢 打', CX, 140);

    // divider & lane
    ctx.fillStyle = '#6b3818'; ctx.fillRect(DIV_X, CY - 60, DIV_W, H - (CY - 60));
    ctx.fillStyle = 'rgba(90,44,18,.18)'; ctx.fillRect(DIV_X + DIV_W, CY - 60, W - DIV_X - DIV_W - 4, H);

    // slots
    SLOT_VALUES.forEach((v, i) => {
      const x = LEFT + i * slotW;
      ctx.fillStyle = v >= 100 ? 'rgba(232,67,46,.85)' : (i % 2 ? 'rgba(217,164,65,.55)' : 'rgba(217,164,65,.3)');
      ctx.fillRect(x + 1, SLOT_TOP + 26, slotW - 2, BOTTOM - SLOT_TOP - 26);
      if (slotFlash && slotFlash.i === i) {
        const a = Math.max(0, 1 - slotFlash.t / .45);
        ctx.fillStyle = 'rgba(255,245,210,' + (a * .85) + ')';
        ctx.fillRect(x + 1, SLOT_TOP + 26, slotW - 2, BOTTOM - SLOT_TOP - 26);
      }
      ctx.fillStyle = v >= 100 ? '#fff5e2' : '#5a2c12';
      ctx.font = '13px Bungee, sans-serif';
      ctx.fillText(v, x + slotW / 2, BOTTOM - 14);
    });
    ctx.strokeStyle = '#8f6a2a'; ctx.lineWidth = 3;
    dividers.forEach(x => { ctx.beginPath(); ctx.moveTo(x, SLOT_TOP); ctx.lineTo(x, BOTTOM); ctx.stroke(); });
    ctx.fillStyle = '#5a2c12'; ctx.fillRect(LEFT - 6, BOTTOM, DIV_X - LEFT + 6, H - BOTTOM);

    // pockets
    pockets.forEach(p => {
      ctx.fillStyle = '#3a1a0a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = p.v >= 500 ? '#e8432e' : '#d9a441'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 2, 0, Math.PI * 2); ctx.stroke();
      if (p.v >= 500) {
        const k = (Math.sin(time * 3) + 1) / 2;
        ctx.globalAlpha = .25 + .35 * k;
        ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 6 + k * 3, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (pocketFlash && pocketFlash.p === p) {
        const k = pocketFlash.t / .6;
        ctx.globalAlpha = Math.max(0, 1 - k);
        ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4 + k * 30, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = p.v >= 500 ? '#c0392b' : '#8a4b22'; ctx.font = '11px Bungee, sans-serif';
      ctx.fillText(p.v, p.x, p.y + p.r + 15);
    });

    // pins
    pins.forEach(p => {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(p.x + 1, p.y + 1.5, p.r, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createRadialGradient(p.x - 1, p.y - 1, .5, p.x, p.y, p.r);
      g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#b07d22');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });

    // bumpers
    bumpers.forEach(q => {
      const lit = (q.flash || 0) > 0;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(q.x + 1.5, q.y + 2, q.r, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createRadialGradient(q.x - 3, q.y - 3, 1, q.x, q.y, q.r);
      g.addColorStop(0, lit ? '#fff5e2' : '#ff8a6e'); g.addColorStop(1, lit ? '#ff6a4a' : '#b5281a');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
    });

    // arch rim
    ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, RAD + 4, Math.PI, 0); ctx.stroke();

    // marquee bulbs chase around the arch, faster while fever is on
    const bulbs = 19, step = Math.floor(time * (fever > 0 ? 14 : 6));
    for (let i = 0; i < bulbs; i++) {
      const ang = Math.PI + (i + .5) / bulbs * Math.PI;
      const bx = CX + Math.cos(ang) * (RAD + 4), by = CY + Math.sin(ang) * (RAD + 4);
      const on = (i + step) % 3 === 0;
      if (on) {
        ctx.fillStyle = fever > 0 ? '#ffe9a8' : '#ffd76a';
        ctx.shadowColor = fever > 0 ? 'rgba(255,160,60,.95)' : 'rgba(255,210,120,.8)';
        ctx.shadowBlur = fever > 0 ? 12 : 8;
      } else {
        ctx.fillStyle = '#7a5a2a'; ctx.shadowBlur = 0;
      }
      ctx.beginPath(); ctx.arc(bx, by, on ? 2.4 : 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // hanging lanterns on the cabinet frame
    lantern(30, 40, Math.sin(time * 1.3) * .07, 1);
    lantern(330, 40, Math.sin(time * 1.1 + 1.7) * .07, 1);

    // fever wash
    if (fever > 0) {
      ctx.save(); roundTopPath(); ctx.clip();
      const a = .06 + .05 * (Math.sin(time * 9) + 1) / 2;
      ctx.fillStyle = 'rgba(255,120,40,' + a + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // plunger
    const py = LANE_REST + R_BALL + (charging ? power * 26 : 0);
    ctx.fillStyle = '#c9c9d1'; ctx.fillRect(LANE_X - 2, py, 4, H - py);
    ctx.fillStyle = '#e8432e'; ctx.fillRect(LANE_X - 9, py, 18, 6);
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let y = py + 8; y < H - 2; y += 4) { ctx.moveTo(LANE_X - 6, y); ctx.lineTo(LANE_X + 6, y + 2); }
    ctx.stroke();
  }

  function drawBall(b) {
    if (b.trail) {
      for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        ctx.globalAlpha = (i / b.trail.length) * .3;
        ctx.fillStyle = b.gold ? '#ffcf5c' : 'hsl(' + b.hue + ',70%,65%)';
        ctx.beginPath(); ctx.arc(t.x, t.y, R_BALL * .85, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(b.x + 1.5, b.y + 2.5, R_BALL, 0, Math.PI * 2); ctx.fill();
    if (b.gold) { ctx.shadowColor = 'rgba(255,200,70,.9)'; ctx.shadowBlur = 14; }
    const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, R_BALL);
    if (b.gold) {
      g.addColorStop(0, '#fffbe8'); g.addColorStop(.45, '#ffd76a'); g.addColorStop(1, '#b06f00');
    } else {
      g.addColorStop(0, '#ffffff'); g.addColorStop(.35, 'hsla(' + b.hue + ',70%,70%,.9)'); g.addColorStop(1, 'hsl(' + b.hue + ',60%,35%)');
    }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, R_BALL, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(b.x - 2.2, b.y - 2.4, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  function drawBits() {
    for (const p of bits) {
      const a = 1 - p.life / p.max;
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'hsl(' + p.hue + ',90%,' + (62 + a * 20) + '%)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + .6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFlashes() {
    ctx.textAlign = 'center';
    for (const f of flashes) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / (f.big ? 1.2 : .9));
      ctx.font = (f.big ? 22 : 15) + 'px Bungee, sans-serif';
      ctx.fillStyle = f.gold ? '#a86a00' : '#c0392b';
      ctx.fillText('+' + f.v, f.x, f.y - f.t * 42 - (f.big ? 8 : 0));
    }
    ctx.globalAlpha = 1;
  }

  function drawScene(time) {
    ctx.save();
    if (shake > .1) {
      const z = 1 + shake * .0035;
      ctx.translate(W / 2 + (Math.random() - .5) * shake * .6, H / 2 + (Math.random() - .5) * shake * .6);
      ctx.scale(z, z);
      ctx.translate(-W / 2, -H / 2);
    }
    drawBoard(time);
    for (const b of balls) drawBall(b);
    drawBits();
    drawFlashes();
    ctx.restore();
  }

  // --- HUD extras ---
  function updateComboUI() {
    lastCombo = combo;
    const el = $('combo');
    if (combo < 2) { el.hidden = true; return; }
    el.hidden = false;
    $('comboMult').textContent = '×' + Math.min(COMBO_MAX, 1 + Math.floor(combo / 2));
    $('comboLabel').textContent = '連擊 ' + combo;
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
    clearTimeout(updateComboUI.h);
    updateComboUI.h = setTimeout(() => el.classList.remove('pop'), 160);
  }
  function updateFeverUI() {
    const el = $('fever');
    if (fever > 0) {
      const w = (fever / FEVER_TIME).toFixed(3);
      if (w !== lastFeverW) { lastFeverW = w; $('feverFill').style.transform = 'scaleX(' + w + ')'; }
      el.hidden = false;
    } else if (!el.hidden) {
      el.hidden = true; lastFeverW = '';
    }
  }

  // --- loop ---
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    const time = now / 1000;

    if (charging) power = Math.min(1, power + dt * 0.9);
    bumpers.forEach(q => { if (q.flash > 0) q.flash -= dt; });
    $('meter').style.width = (power * 100) + '%';

    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
    if (fever > 0) fever = Math.max(0, fever - dt);
    if (shake > 0) shake = Math.max(0, shake - 70 * dt);
    if (slotFlash) { slotFlash.t += dt; if (slotFlash.t > .45) slotFlash = null; }
    if (pocketFlash) { pocketFlash.t += dt; if (pocketFlash.t > .6) pocketFlash = null; }

    const sub = 10, h = dt / sub;
    for (let s = 0; s < sub; s++) for (const b of balls) if (!b.done) step(b, h);
    balls = balls.filter(b => !b.done);
    for (const b of balls) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 7) b.trail.shift();
    }

    for (const p of bits) { p.life += dt; p.vy += 900 * dt; p.vx *= .995; p.x += p.vx * dt; p.y += p.vy * dt; }
    bits = bits.filter(p => p.life < p.max);
    for (const f of flashes) f.t += dt;
    flashes = flashes.filter(f => f.t < (f.big ? 1.2 : .9));

    if (playing && !laneBall()) loadBall();
    if (playing && left === 0 && balls.length === 0) endGame();

    if (combo !== lastCombo) updateComboUI();
    updateFeverUI();

    drawScene(time);
    requestAnimationFrame(frame);
  }

  // --- input ---
  function press() {
    unlockAudio();
    if (!playing) return;
    const b = laneBall();
    if (!b || b.y < LANE_REST - 1) return;   // wait until the ball rests on the plunger
    charging = true; power = 0; $('pull').classList.add('held');
  }
  function release() {
    $('pull').classList.remove('held');
    if (!charging) return;
    charging = false;
    const b = laneBall();
    if (b) { b.vy = -(520 + power * 820); beep(180, .12, .05, 'sawtooth'); }
    power = 0;
  }
  const pull = $('pull');
  pull.addEventListener('pointerdown', e => { e.preventDefault(); try { pull.setPointerCapture(e.pointerId); } catch (_) {} press(); });
  pull.addEventListener('pointerup', release);
  pull.addEventListener('pointercancel', release);
  cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} press(); });
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (!playing) { e.preventDefault(); startGame(); return; }
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) press(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); release(); } });

  // --- game flow ---
  function rankFor(s) {
    if (s >= 12000) return '夜市彈珠之神｜老闆直接把台子收起來';
    if (s >= 6000) return '彈珠殺手｜老闆開始冒冷汗';
    if (s >= 2500) return '熟客等級｜老闆多送你一顆';
    if (s >= 900) return '手氣不錯｜再來一局吧';
    return '夜市新手｜老闆笑而不語';
  }
  function startGame() {
    unlockAudio();
    balls = []; score = 0; left = 10; playing = true; flashes = []; bits = [];
    combo = 0; comboTimer = 0; fever = 0; shake = 0; slotFlash = null; pocketFlash = null;
    goldSeen = false;
    $('overlay').hidden = true; hud(); loadBall();
  }
  function endGame() {
    playing = false; charging = false; power = 0;
    $('pull').classList.remove('held');
    const newBest = score > best;
    if (newBest) { best = score; try { localStorage.setItem('marble-best', String(best)); } catch (e) {} }
    hud();
    $('ovTitle').textContent = newBest ? '新紀錄！' : '這局結束';
    $('ovScore').hidden = false; $('ovScore').textContent = score;
    $('ovText').innerHTML = '10 顆彈珠打完了。<br><strong>' + rankFor(score) + '</strong>';
    $('startBtn').textContent = '再玩一局';
    $('overlay').hidden = false;
    combo = 0; comboTimer = 0; fever = 0;
  }
  $('startBtn').addEventListener('click', startGame);

  hud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
